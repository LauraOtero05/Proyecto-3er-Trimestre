<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión</title>
    <link rel="stylesheet" href="/Lenguaje-de-Marcas/styles/style.css">
    <link rel="stylesheet" href="/Lenguaje-de-Marcas/styles/animations.css">
</head>

<body>
    <div class="container scene" aria-hidden="true">
        <div class="scene__aurora"></div>
        <div id="stars"></div>
        <div id="stars2"></div>
        <div id="stars3"></div>
    </div>
    <section class="login">
        <div class="login__card">
            <header class="login__header">
                <h1 class="title">Iniciar Sesión</h1>
                <p class="text">Introduce tus credenciales para acceder al sistema.</p>
            </header>

            <form class="login__form" action="dashboard.html">
                <div class="form__group">
                    <label class="login__label" for="username">Usuario o Email</label>
                    <input class="login__input" id="username" type="email" placeholder="ejemplo@email.com" required>
                </div>
                <div class="form__group">
                    <div class="login__label-wrapper">
                        <label class="login__label" for="password">Contraseña</label>
                    </div>
                    <input class="login__input" id="password" type="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="login__button">
                    Iniciar Sesión <span class="material-symbols-rounded">arrow_forward</span>
                </button>
            </form>

        </div>
    </section>
    <script src="/Lenguaje-de-Marcas/script/script.js"></script>
    <script src="/Lenguaje-de-Marcas/script/entities/pedidos.js"></script>
    <script src="/Lenguaje-de-Marcas/script/entities/clientes.js"></script>
    <script src="/Lenguaje-de-Marcas/script/entities/Trabajador.js"></script>
    <script src="/Lenguaje-de-Marcas/script/storage.js"></script>
</body>

</html>
