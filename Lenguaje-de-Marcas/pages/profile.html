<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil</title>
    <link rel="stylesheet" href="/Lenguaje-de-Marcas/Lenguaje-de-Marcas/styles/style.css">
</head>

<body>

    <div class="scene" aria-hidden="true">
        <div class="scene__aurora"></div>
    </div>
    <main class="layout">
        <nav class="sidebar">
            <div class="sidebar__logo">
                <div class="logo">
                    <img src="/Lenguaje-de-Marcas/Lenguaje-de-Marcas/resources/logo/74-dark.png" alt="">
                </div>
                <img src="/Lenguaje-de-Marcas/Lenguaje-de-Marcas/resources/logo/Minutes-white.png" alt=""
                    class="logo__text">
            </div>
            <div class="nav__section">
                <div class="nav__item" data-page="dashboard" data-href="dashboard.html">
                    <span class="material-symbols-rounded">dashboard</span>
                    <span class="nav__label">Dashboard</span>
                </div>
                <div class="nav__item" data-page="clients" data-href="clients.html">
                    <span class="material-symbols-rounded">headphones</span>
                    <span class="nav__label">Clientes</span>
                </div>
                <div class="nav__item" data-page="workers" data-href="workers.html">
                    <span class="material-symbols-rounded">support_agent</span>
                    <span class="nav__label">Trabajadores</span>
                </div>
                <div class="nav__item" data-page="orders" data-href="orders.html">
                    <span class="material-symbols-rounded">shopping_bag</span>
                    <span class="nav__label">Pedidos (Detalles del Pedido)</span>
                </div>
                <div class="nav__item" data-page="products" data-href="products.html">
                    <img src="/Lenguaje-de-Marcas/Lenguaje-de-Marcas/resources/icons/cd-white.svg"
                        data-default="/Lenguaje-de-Marcas/Lenguaje-de-Marcas/resources/icons/cd-white.svg"
                        data-active="/Lenguaje-de-Marcas/Lenguaje-de-Marcas/resources/icons/cd-dark.svg" alt="Products">
                    <span class="nav__label">Productos</span>
                </div>
                <div class="nav__item" data-page="suppliers" data-href="suppliers.html">
                    <span class="material-symbols-rounded">adaptive_audio_mic</span>
                    <span class="nav__label">Proveedores</span>
                </div>
            </div>
            <div class="nav__divider"></div>
            <div class="nav__spacer"></div>
            <div class="nav__divider"></div>
            <div class="nav__section">
                <div class="nav__item active" data-page="settings" data-href="profile.html">
                    <span class="material-symbols-rounded">account_circle</span>
                    <span class="nav__label">Perfil</span>
                </div>
                <div class="nav__item" data-page="profile">
                    <span class="material-symbols-rounded">logout</span>
                    <span class="nav__label">Cerrar Sesión</span>
                </div>
            </div>
        </nav>

        <section class="content">
            <header class="p-header">

                <div>
                    <p class="tag">ÁREA PERSONAL</p>
                    <h1>Bienvenido a tu área personal</h1>
                </div>

            </header>

            <section class="prof-outerbox">

                <div class="prof-data outerbox">
                    <img class="prof-img" src="/Lenguaje-de-Marcas/Lenguaje-de-Marcas/resources/images/Thor.jpeg"
                        alt="imagen del trabajador">
                    <h2>Noemí Cano</h2>
                </div>

                <form id="profileForm" class="modal__form outerbox">

                    <h3>Información personal</h3>

                    <div class="form__group form__group-line">

                        <label class="form__radio">
                            <input type="radio" name="gender" value="Femenino"checked>
                            Femenino
                        </label>

                        <label class="form__radio">
                            <input type="radio" name="gender" value="Masculino">
                            Masculino
                        </label>
                    </div>

                    <div class="form__group form__group-line">
                        <div class="form__group">
                            <label>Nombre</label>
                            <input type="text" id="formName" required>
                        </div>
    
                        <div class="form__group">
                            <label>Apellido</label>
                            <input type="text" id="formLastName" required>
                        </div>
                    </div>

                    <div class="form__group">
                        <label>Email</label>
                        <input type="email" id="formEmail" required>
                    </div>

                    <div class="form__group">
                        <label>Dirección</label>
                        <input type="text" id="formAdress" placeholder=" Calle nombre, numero" required>
                    </div>

                    <div class="form__group form__group-line">
                        <div class="form__group">
                            <label>Número de movil</label>
                            <input type="text" id="formNumber" placeholder="+34 600 00 00 00" required>
                        </div>
    
                        <div class="form__group">
                            <label>Fecha de nacimiento</label>
                            <input type="date" id="formDate" placeholder="dd/mm/yyyy">
                        </div>
                    </div>

                    <button type="submit" id="SubmitInformation" class="button__items">
                        Actualizar Datos
                    </button>
                </form>
            </section>
        </section>

    </main>

    <script src="/Lenguaje-de-Marcas/Lenguaje-de-Marcas/script/storage.js"></script>
    <script src="/Lenguaje-de-Marcas/Lenguaje-de-Marcas/script/entities/profile.js"></script><script src="/Lenguaje-de-Marcas/Lenguaje-de-Marcas/script/script.js"></script>

</body>

</html>
